#btnA{--b:calc(var(--d)*.58);width:var(--b);height:var(--b);border-radius:50%;border:0;padding:0;background:radial-gradient(circle at 50% 30%,#f2f5ff 0,#cfd9fb 46%,#96a9e8 100%);box-shadow:0 0 0 calc(var(--b)*.03) #091848,0 0 0 calc(var(--b)*.055) #2f7bff,0 0 44px 10px #1f5dffa0,inset 0 -12px 30px #7f96e0;touch-action:none;display:grid;place-items:center;font-size:0;transition:transform .05s}
#btnA svg{width:36%;height:36%}
#btnA:active{transform:scale(.95);box-shadow:0 0 0 calc(var(--b)*.03) #091848,0 0 0 calc(var(--b)*.055) #5f9bff,0 0 60px 14px #2f6bffcc,inset 0 -8px 24px #7f96e0}
#cfg{position:fixed;inset:0;z-index:40;background:#02061acc;display:none;align-items:center;justify-content:center;font-family:'Plus Jakarta Sans',sans-serif;color:#fff}
#cfg .cp{width:min(900px,92vw);max-height:88vh;display:flex;flex-direction:column;background:#0a1330;border:1.5px solid #ffffff2a;border-radius:24px;padding:22px 26px;box-shadow:0 0 60px #1f5dffaa}
#cfg h2{margin:0 0 4px;font-size:28px;font-family:inherit}#cfg p{margin:0 0 10px;color:#9fb0e0;font-size:15px}
#cfg .cl{overflow:auto;flex:1}#cfg h3{margin:14px 0 6px;font-size:16px;color:#7cc2ff;font-family:inherit}
#cfg .cr{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid #ffffff14;font-size:16px}
#cfg .cr span{flex:1}#cfg .cr em{color:#8fa3d8;font-style:normal;max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px}
#cfg button,#cfg label.bt{background:#1b2f6e;color:#fff;border:0;border-radius:10px;padding:7px 12px;font-size:14px;cursor:pointer;font-family:inherit}
#cfg .cb{display:flex;gap:10px;justify-content:flex-end;margin-top:14px}
.wipe{position:fixed;inset:0;z-index:30;pointer-events:none;background:linear-gradient(100deg,#2f6bff,#7a2fd0 60%,#ff5a9a);display:flex;align-items:center;justify-content:center;font-family:"Lilita One",sans-serif;font-size:9vh;color:#fff;text-shadow:0 6px 0 #0004;animation:wp 1s cubic-bezier(.7,0,.3,1) forwards}
@keyframes wp{0%{transform:translateX(105%)}42%,58%{transform:none}100%{transform:translateX(-105%)}}
#arrs{grid-row:2;display:none;grid-template:repeat(3,auto)/repeat(3,auto);place-content:center;gap:2vh}
#arrs button{--b:min(26vw,calc((100dvh - 150px)/3),150px);width:var(--b);height:var(--b);border-radius:50%;border:0;padding:0;background:radial-gradient(circle at 50% 30%,#f2f5ff 0,#cfd9fb 46%,#96a9e8 100%);box-shadow:0 0 0 4px #091848,0 0 0 8px #2f7bff,0 0 30px 6px #1f5dffa0;display:grid;place-items:center;touch-action:none}
#arrs button:active{transform:scale(.93)}#arrs svg{width:52%;height:52%}
#msg{position:fixed;inset:auto 0 0 0;text-align:center;padding:8px;font-size:13px;color:var(--mute);pointer-events:none;z-index:20}
</style>

/* ============ Red: WebRTC con PeerJS (solo usa el servidor para el primer contacto) ============ */
function makeTvRoom(){
  const pads={},conns={};let last={};
  const peer=new Peer("mc-"+CODE);
  peer.on("error",e=>{if(e.type==="unavailable-id")location.reload();else msg("Error de red: "+e.type)});
  const push=c=>{try{c.send({slot:last.slots?last.slots[c.peer]:undefined,hint:last.hint||"",mode:last.mode||""})}catch(e){}};
  peer.on("connection",c=>{
    c.on("open",()=>{conns[c.peer]=c;pads[c.peer]={};push(c)});
    c.on("data",d=>{if(d&&typeof d==="object")pads[c.peer]=d});
    const gone=()=>{delete pads[c.peer];delete conns[c.peer]};
    c.on("close",gone);c.on("error",gone);
  });
  return{peers:()=>Object.keys(pads).map(id=>({peer:id,isMe:false,presence:Object.assign({role:"pad"},pads[id])})),
    presence:p=>{last=p;Object.values(conns).forEach(push)}};
}
function makePadRoom(code){
  const peer=new Peer();let conn=null,ok=false,info={};const mine={role:"pad",jx:0,jy:0,a:0};
  peer.on("open",()=>{conn=peer.connect("mc-"+code,{reliable:true});
    conn.on("open",()=>{ok=true;conn.send(mine)});conn.on("data",d=>{info=d||{}});conn.on("close",()=>{ok=false})});
  peer.on("error",e=>msg("Error: "+e.type+" (¿la tele está abierta?)"));
  return{ok:()=>ok,info:()=>info,presence:p=>{Object.assign(mine,p);if(conn&&conn.open)conn.send(mine)}};
}
if(isPad){room=makePadRoom(CODE);initPad()}else{room=makeTvRoom();initTV()}

/* ============ MANDO (celular) ============ */
function initPad(){
  $("pad").style.display="grid";document.querySelectorAll(".lg").forEach(i=>i.src=LOGO);
  const who=$("who"),dot=$("dot"),st=$("stick"),kn=$("knob"),A=$("btnA");let a=0,act=null,mySlot=null,wl=false;
  const pres=p=>{try{room.presence(p)}catch(e){}};
  const keepAwake=async()=>{if(wl)return;wl=true;try{await navigator.wakeLock.request("screen")}catch(e){}};
  const mv=e=>{if(e.pointerId!==act)return;const b=st.getBoundingClientRect(),R=b.width*.3;
    let dx=(e.clientX-b.left-b.width/2)/R,dy=(e.clientY-b.top-b.height/2)/R;const l=Math.hypot(dx,dy);if(l>1){dx/=l;dy/=l}
    kn.style.transform="translate("+dx*b.width*.2+"px,"+dy*b.width*.2+"px)";
    pres({jx:Math.round(dx*100)/100,jy:Math.round(dy*100)/100})};
  st.addEventListener("pointerdown",e=>{keepAwake();act=e.pointerId;st.setPointerCapture(act);kn.style.transition="none";mv(e)});
  st.addEventListener("pointermove",mv);
  const up=e=>{if(e.pointerId!==act)return;act=null;kn.style.transition="transform .12s";kn.style.transform="";pres({jx:0,jy:0})};
  st.addEventListener("pointerup",up);st.addEventListener("pointercancel",up);
  A.addEventListener("pointerdown",()=>{keepAwake();a++;pres({a});try{navigator.vibrate&&navigator.vibrate(15)}catch(e){}});
  document.addEventListener("contextmenu",e=>e.preventDefault());
  let an=0;document.querySelectorAll("#arrs button").forEach(b=>b.addEventListener("pointerdown",()=>{keepAwake();an++;pres({ar:+b.dataset.d,an});try{navigator.vibrate&&navigator.vibrate(15)}catch(e){}}));
  const setBar=(t,c)=>{who.textContent=t;dot.style.background=c;dot.style.color=c};
  setInterval(()=>{
    const md=(room.info()||{}).mode==="arrows";$("zones").style.display=md?"none":"flex";$("arrs").style.display=md?"grid":"none";
    if(!room.ok()){setBar("Conectando…","#7b86a8");return}
    const i=room.info(),s=i.slot;
    if(s===undefined||s===null){setBar("Esperando lugar…","#7b86a8");return}
    if(s!==mySlot){mySlot=s;try{navigator.vibrate&&navigator.vibrate([80,40,80])}catch(e){}}
    setBar("Jugador "+(s+1),COLS[s]);
  },300);
}

/* ============ AUDIO (todo sintetizado, sin archivos) ============ */
let AC=null,muted=false,mg=null,step=0;
const CUS={},CN={};let trackKey=null,trackEl=null;
const idb=new Promise(r=>{try{const q=indexedDB.open("mc",1);q.onupgradeneeded=()=>q.result.createObjectStore("f");q.onsuccess=()=>r(q.result);q.onerror=()=>r(null)}catch(e){r(null)}});
const idbOp=(m,k,v)=>idb.then(d=>d&&new Promise(r=>{try{const s=d.transaction("f",m==="get"?"readonly":"readwrite").objectStore("f"),q=m==="get"?s.get(k):m==="put"?s.put(v,k):s.delete(k);q.onsuccess=()=>r(q.result);q.onerror=()=>r()}catch(e){r()}}));
function audioInit(){if(AC){if(AC.state==="suspended")AC.resume();return}
  try{AC=new(window.AudioContext||window.webkitAudioContext)();mg=AC.createGain();mg.gain.value=.55;mg.connect(AC.destination);music()}catch(e){}}
function tone(f,d=.12,type="square",v=.15,when=0,slide=0){
  if(!AC||muted)return;const t=AC.currentTime+when,o=AC.createOscillator(),g=AC.createGain();
  o.type=type;o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),t+d);
  g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(mg);o.start(t);o.stop(t+d+.03)}
const SFX={
  join:()=>[523,659,784,1046].forEach((f,i)=>tone(f,.13,"triangle",.22,i*.07)),
  leave:()=>[392,294].forEach((f,i)=>tone(f,.16,"triangle",.2,i*.1)),
  coin:()=>{tone(988,.07,"square",.09);tone(1319,.14,"square",.09,.07)},
  tick:()=>tone(660,.09,"square",.13),
  go:()=>tone(990,.45,"square",.16),
  hit:()=>tone(180,.2,"sawtooth",.18,0,-120),
  press:()=>tone(400+Math.random()*200,.05,"square",.07),
  sel:()=>tone(740,.05,"triangle",.15),
  fall:()=>tone(700,.45,"sawtooth",.14,0,-600),
  win:()=>[523,659,784,1046,784,1046,1318].forEach((f,i)=>tone(f,.17,"square",.13,i*.1))};
const sfx=n=>{if(CUS["s:"+n]){if(!muted)try{const a=new Audio(CUS["s:"+n]);a.volume=.85;a.play().catch(()=>{})}catch(e){}return}try{SFX[n]()}catch(e){}};
function music(){setInterval(()=>{
  if(!AC||muted||trackKey)return;step++;const fast=mood===1;if(!fast&&step%2)return;
  if(step%4===0)tone([110,110,131,98][(step>>3)%4],.28,"triangle",.1);
  const sc=[0,3,5,7,10,12,15,12,10,7,5,3],n=sc[(step*(fast?5:3)+(step>>4))%sc.length];
  tone(220*Math.pow(2,n/12),.13,"square",.03);
  if(fast&&step%2===0)tone(90,.04,"square",.035)},170)}

  let qrSvg="";try{const q=qrcode(0,"M");q.addData(base);q.make();qrSvg=q.createSvgTag(4,0)}catch(e){}

  const burst=(x,y,c,n=14,sp=260)=>{for(let i=0;i<n;i++){const a=Math.random()*6.283,s=sp*(.3+Math.random());P.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:.6+Math.random()*.5,m:1.1,c,r:3+Math.random()*4})}};

  function toast(t,k){const d=document.createElement("div");d.className="toast";d.textContent=t;toasts.appendChild(d);setTimeout(()=>d.remove(),3200);sfx(k)}

  const active=()=>[0,1,2,3].filter(i=>slots[i]);

    for(const id of pads)if(!slots.includes(id)){const f=slots.indexOf(null);if(f>=0){slots[f]=id;lastA[f]=inp(f).a;toast(AV[f]+" ¡Jugador "+(f+1)+" se unió!","join");burst(W/2,200,COLS[f],40,400)}}
    const map={};slots.forEach((s,i)=>{if(s)map[s]=i});
    const hint=scene==="lobby"?"Elegí el juego":scene==="result"||scene==="final"?"¡Resultados!":"¡A jugar!";
    const mode=(scene==="count"||scene==="play")&&G&&GAMES[sel].mode||"";const k=JSON.stringify(map)+hint+mode;if(k!==slotKey){slotKey=k;uiKey="";room.presence({slots:map,hint,mode})}
  }

  /* ----- minijuegos ----- */
  const spawnCoin=()=>G.coins.push({x:80+Math.random()*(W-160),y:130+Math.random()*(H-200)});
  const sumoFmt=p=>p.score>=1000?"¡Último en pie!":p.score.toFixed(1)+"s";
  const SY=["⭐","❤️","🔷","🍀","🔥"];
  const symNew=()=>{G.rd++;const a=[];for(let i=0;i<24;i++)a.push(i%5);for(let i=23;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}G.tile=a;G.tg=Math.random()*5|0;G.ph="show";G.tm=Math.max(1.5,4.2-G.rd*.3)};
  const SH={
    circulo:()=>Array.from({length:40},(_,i)=>[Math.cos(i/40*6.2832),Math.sin(i/40*6.2832)]),
    triangulo:()=>[[0,-1],[.95,.8],[-.95,.8]],
    estrella:()=>Array.from({length:10},(_,i)=>{const a=i/10*6.2832-1.5708,r=i%2?.42:1;return[Math.cos(a)*r,Math.sin(a)*r]}),

    for(const f of FT){f.l-=dt;f.y-=40*dt;g.globalAlpha=Math.max(0,f.l);txt(f.t,f.x,f.y,34,f.c)}g.globalAlpha=1;FT=FT.filter(f=>f.l>0);
    g.restore();renderUI();requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
}
