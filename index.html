<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mini Consola</title>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<style>
:root{--bg:#14102b;--bg2:#1f1a45;--ink:#f6f3ff;--mute:#a9a3d1;--p1:#ff5a5f;--p2:#3ddc97;--p3:#4cc9f0;--p4:#ffd23f;--acc:#ffd23f;color-scheme:dark;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14102b;--bg2:#1f1a45;--ink:#f6f3ff}}
:root[data-theme="dark"]{--bg:#14102b;--bg2:#1f1a45;--ink:#f6f3ff}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:Nunito,system-ui,sans-serif;overflow:hidden;-webkit-user-select:none;user-select:none}
h1,h2,.big{font-family:"Lilita One",Impact,sans-serif;font-weight:400;margin:0}
#tv{position:fixed;inset:0}
canvas{width:100%;height:100%;object-fit:contain;display:block;background:var(--bg)}
#ui{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;padding:4vh 5vw;gap:3vh;background:radial-gradient(circle at 20% 0,var(--bg2),var(--bg) 60%)}
#ui.off{display:none}
#ui h1{font-size:min(8vh,9vw);letter-spacing:.02em}
.row{display:flex;gap:4vw;align-items:stretch;flex-wrap:wrap}
.qr{background:#fff;color:#222;border-radius:18px;padding:14px;text-align:center;font-weight:800;font-size:clamp(11px,1.8vh,18px);max-width:260px}
.qr svg{width:min(26vh,40vw);height:min(26vh,40vw);display:block;margin:0 auto 6px}
.qr small{display:block;word-break:break-all;font-weight:600;color:#555;font-size:.8em}
.col{flex:1;min-width:260px;display:flex;flex-direction:column;gap:2.5vh}
.slots{display:grid;grid-template-columns:repeat(4,1fr);gap:1.2vw}
.slot{border:3px dashed #4a4380;border-radius:16px;padding:1.6vh 1vw;text-align:center;color:var(--mute);font-size:clamp(12px,2.2vh,22px);font-weight:800}
.slot.on{border-style:solid;color:#14102b;border-color:transparent}
.games{display:grid;grid-template-columns:1fr 1fr;gap:1.5vw}
.card{background:var(--bg2);border:4px solid transparent;border-radius:20px;padding:2vh 1.6vw;cursor:pointer}
.card.sel{border-color:var(--acc);transform:scale(1.03)}
.card h2{font-size:clamp(18px,4vh,40px)}
.card p{margin:.6vh 0 0;color:var(--mute);font-size:clamp(12px,2.1vh,20px)}
.hint{color:var(--mute);font-size:clamp(12px,2vh,20px)}
.big{font-size:min(10vh,10vw)}
/* mando */
#pad{position:fixed;inset:0;display:none;grid-template-rows:auto 1fr;background:var(--bg);touch-action:none;padding-top:env(safe-area-inset-top,0px)}
#bar{padding:10px 14px;font-family:"Lilita One",sans-serif;font-size:20px;text-align:center;background:#2b2560;color:#fff}
#zones{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:12px 12px calc(12px + env(safe-area-inset-bottom,0px))}
#stick{position:relative;border-radius:24px;background:var(--bg2);display:flex;align-items:center;justify-content:center;color:var(--mute);font-weight:800;touch-action:none}
#knob{position:absolute;width:84px;height:84px;border-radius:50%;background:var(--acc);opacity:.0;pointer-events:none;box-shadow:0 0 0 6px #ffffff22}
#btnA{border:0;border-radius:24px;background:var(--acc);color:#14102b;font-family:"Lilita One",sans-serif;font-size:min(30vw,26vh);touch-action:none}
#btnA:active{filter:brightness(.8);transform:scale(.97)}
#msg{position:fixed;inset:auto 0 0 0;text-align:center;padding:8px;font-size:13px;color:var(--mute)}
</style>
</head>
<body>
<!-- TELE -->
<div id="tv" hidden>
  <canvas id="cv" width="1280" height="720"></canvas>
  <div id="ui"></div>
</div>
<!-- MANDO -->
<div id="pad">
  <div id="bar">Conectando…</div>
  <div id="zones"><div id="stick"><div id="knob"></div><span>Tocá y arrastrá</span></div><button id="btnA">A</button></div>
</div>
<div id="msg"></div>

<script>
const COLS=["#ff5a5f","#3ddc97","#4cc9f0","#ffd23f"];
const msg=t=>{document.getElementById("msg").textContent=t||""};
const qs=new URLSearchParams(location.search);
const isPad=qs.has("sala");
const rnd=()=>Math.random().toString(36).replace(/[^a-z]/g,"").slice(0,4).padEnd(4,"x");
const CODE=isPad?qs.get("sala"):rnd();
let room=null;

/* Capa de red: WebRTC con PeerJS (sirve solo para conectar, después va directo) */
function makeTvRoom(){
  const pads={},conns={};let last={};
  const peer=new Peer("mc-"+CODE);
  peer.on("error",e=>{if(e.type==="unavailable-id")location.reload();else msg("Error de red: "+e.type)});
  peer.on("connection",c=>{
    c.on("open",()=>{conns[c.peer]=c;pads[c.peer]={};push(c)});
    c.on("data",d=>{if(d&&typeof d==="object")pads[c.peer]=d});
    const gone=()=>{delete pads[c.peer];delete conns[c.peer]};
    c.on("close",gone);c.on("error",gone);
  });
  const push=c=>{try{c.send({slot:last.slots?last.slots[c.peer]:undefined,hint:last.hint||""})}catch(e){}};
  return{peers:()=>Object.keys(pads).map(id=>({peer:id,isMe:false,sameTab:false,presence:Object.assign({role:"pad"},pads[id])})),
    presence:p=>{last=p;Object.values(conns).forEach(push)}};
}
function makePadRoom(code){
  const peer=new Peer();let conn=null,ok=false,info={};const mine={role:"pad",jx:0,jy:0,a:0};
  peer.on("open",()=>{
    conn=peer.connect("mc-"+code,{reliable:true});
    conn.on("open",()=>{ok=true;conn.send(mine)});
    conn.on("data",d=>{info=d||{}});
    conn.on("close",()=>{ok=false});
  });
  peer.on("error",e=>msg("Error: "+e.type+" (¿la tele está abierta?)"));
  return{ok:()=>ok,info:()=>info,presence:p=>{Object.assign(mine,p);if(conn&&conn.open)conn.send(mine)}};
}
if(isPad){room=makePadRoom(CODE);initPad()}else{room=makeTvRoom();initTV()}

/* ================= MANDO (celular) ================= */
function initPad(){
  document.getElementById("pad").style.display="grid";
  const bar=document.getElementById("bar"),st=document.getElementById("stick"),kn=document.getElementById("knob"),A=document.getElementById("btnA");
  let a=0,cx=0,cy=0,act=null;const R=60;
  const pres=p=>{try{room.presence(p)}catch(e){}};
  pres({role:"pad",jx:0,jy:0,a:0});
  st.addEventListener("pointerdown",e=>{act=e.pointerId;st.setPointerCapture(act);cx=e.clientX;cy=e.clientY;kn.style.opacity=.9;mv(e)});
  const mv=e=>{if(e.pointerId!==act)return;let dx=(e.clientX-cx)/R,dy=(e.clientY-cy)/R;const l=Math.hypot(dx,dy);if(l>1){dx/=l;dy/=l}
    const b=st.getBoundingClientRect();kn.style.left=(cx-b.left-42+dx*R)+"px";kn.style.top=(cy-b.top-42+dy*R)+"px";
    pres({jx:Math.round(dx*100)/100,jy:Math.round(dy*100)/100})};
  st.addEventListener("pointermove",mv);
  const up=e=>{if(e.pointerId!==act)return;act=null;kn.style.opacity=0;pres({jx:0,jy:0})};
  st.addEventListener("pointerup",up);st.addEventListener("pointercancel",up);
  A.addEventListener("pointerdown",()=>{a++;pres({a});try{navigator.vibrate&&navigator.vibrate(12)}catch(e){}});
  document.addEventListener("contextmenu",e=>e.preventDefault());
  setInterval(()=>{
    if(!room.ok()){bar.textContent="Conectando con la tele…";bar.style.background="#2b2560";bar.style.color="#fff";return}
    const i=room.info(),s=i.slot;
    if(s===undefined||s===null){bar.textContent="Esperando lugar… (máx. 4)";return}
    bar.textContent="Jugador "+(s+1)+" · "+(i.hint||"");
    bar.style.background=COLS[s];bar.style.color="#14102b";
    document.documentElement.style.setProperty("--acc",COLS[s]);
  },300);
}

/* ================= TELE (consola) ================= */
function initTV(){
  document.getElementById("tv").hidden=false;
  const cv=document.getElementById("cv"),g=cv.getContext("2d"),ui=document.getElementById("ui");
  const W=1280,H=720;
  const GAMES=[
    {id:"coins",name:"Monedas locas",desc:"Juntá más monedas que los demás en 30 segundos. Mové con el joystick."},
    {id:"race",name:"Carrera de toques",desc:"Tocá el botón A lo más rápido que puedas. ¡El primero en llegar gana!"}];
  let slots=[null,null,null,null],slotKey="",scene="lobby",sel=0,G=null,lastA=[0,0,0,0],lastX=0,uiKey="",sceneT=0,hintKey="";
  const base=location.href.split("#")[0].split("?")[0]+"?sala="+CODE;
  let qrSvg="";
  try{const q=qrcode(0,"M");q.addData(base);q.make();qrSvg=q.createSvgTag(4,0)}catch(e){}

  const padOf=id=>room?room.peers().find(p=>p.peer===id):null;
  const inp=i=>{const p=slots[i]&&padOf(slots[i]);const s=p&&p.presence||{};return{x:+s.jx||0,y:+s.jy||0,a:+s.a||0}};
  const active=()=>slots.map((s,i)=>s?i:-1).filter(i=>i>=0);
  function syncSlots(){
    if(!room)return;
    const pads=room.peers().filter(p=>!p.isMe&&p.presence&&p.presence.role==="pad").map(p=>p.peer),set=new Set(pads);
    for(let i=0;i<4;i++)if(slots[i]&&!set.has(slots[i]))slots[i]=null;
    for(const id of pads)if(!slots.includes(id)){const f=slots.indexOf(null);if(f>=0)slots[f]=id}
    const map={};slots.forEach((s,i)=>{if(s)map[s]=i});
    const hint=scene==="lobby"?"Elegí el juego":scene==="play"||scene==="count"?"¡A jugar!":"Resultado";
    const k=JSON.stringify(map)+hint;
    if(k!==slotKey){slotKey=k;room.presence({role:"tv",slots:map,hint})}
  }
  function start(){
    const act=active();if(!act.length)return;
    const id=GAMES[sel].id;
    G={id,act,t:3,time:30,players:act.map((i,n)=>({i,x:200+n*300,y:360,score:0,prog:0})),coins:[]};
    if(id==="coins")while(G.coins.length<7)spawn();
    scene="count";sceneT=0;uiKey="";
  }
  const spawn=()=>G.coins.push({x:80+Math.random()*(W-160),y:110+Math.random()*(H-190)});
  function finish(){
    scene="result";sceneT=0;uiKey="";
    const ps=[...G.players].sort((a,b)=>(G.id==="race"?b.prog-a.prog:b.score-a.score));
    G.rank=ps;
  }
  function setScene(s){scene=s;uiKey=""}

  /* --- UI HTML (lobby / resultado / cuenta regresiva) --- */
  function renderUI(){
    let k=scene+sel+slotKey+(G?G.t|0:"");if(k===uiKey)return;uiKey=k;
    if(scene==="play"){ui.className="off";return}ui.className="";
    if(scene==="count"){ui.style.background="transparent";ui.innerHTML=`<div style="text-align:center"><div class="big" style="font-size:30vh;color:var(--acc)">${Math.max(1,Math.ceil(G.t))}</div><div class="hint">${GAMES[sel].name}</div></div>`;return}
    ui.style.background="";
    if(scene==="result"){
      const r=G.rank,win=r[0];
      ui.innerHTML=`<h1 style="color:${COLS[win.i]}">¡Ganó el Jugador ${win.i+1}!</h1><div class="slots" style="grid-template-columns:repeat(${r.length},1fr)">${r.map((p,n)=>`<div class="slot on" style="background:${COLS[p.i]}">${n+1}º · J${p.i+1}<br>${G.id==="race"?Math.round(p.prog*100)+"%":p.score+" monedas"}</div>`).join("")}</div><div class="hint">Apretá A en cualquier mando para volver al menú</div>`;return}
    const sl=[0,1,2,3].map(i=>slots[i]?`<div class="slot on" style="background:${COLS[i]}">Jugador ${i+1}<br>¡Listo!</div>`:`<div class="slot">Jugador ${i+1}<br>esperando…</div>`).join("");
    const gm=GAMES.map((x,n)=>`<div class="card ${n===sel?"sel":""}" data-g="${n}"><h2>${x.name}</h2><p>${x.desc}</p></div>`).join("");
    ui.innerHTML=`<h1>🎮 Mini Consola</h1><div class="row"><div class="qr">${qrSvg}Escaneá con el celu<small>${base.replace(/^https?:\/\//,"")}</small></div><div class="col"><div class="slots">${sl}</div><div class="games">${gm}</div><div class="hint">Jugador 1: joystick ◀ ▶ para elegir el juego y A para empezar (o tocá la tarjeta en la tele).</div></div></div>`;
  }
  ui.addEventListener("click",e=>{const c=e.target.closest(".card");if(!c)return;const n=+c.dataset.g;if(n===sel)start();else{sel=n;uiKey=""}});
  document.addEventListener("keydown",e=>{if(scene!=="lobby")return;if(e.key==="ArrowLeft"||e.key==="ArrowRight"){sel=(sel+1)%2;uiKey=""}if(e.key==="Enter")start()});

  /* --- loop --- */
  let last=performance.now();
  function frame(now){
    const dt=Math.min(.05,(now-last)/1000);last=now;sceneT+=dt;
    syncSlots();
    const ins=[0,1,2,3].map(inp),press=ins.map((v,i)=>{const p=v.a!==lastA[i]&&slots[i];lastA[i]=v.a;return!!p});
    if(scene==="lobby"){
      const h=active()[0];
      if(h!==undefined){const x=ins[h].x;if(x>.7&&lastX<=.7){sel=(sel+1)%2;uiKey=""}else if(x<-.7&&lastX>=-.7){sel=(sel+1)%2;uiKey=""}lastX=x;if(press[h])start()}
      drawBg();
    }else if(scene==="count"){G.t-=dt;if(G.t<=0){scene="play";G.t=0;uiKey=""}drawGame()}
    else if(scene==="play"){
      if(G.id==="coins"){
        G.time-=dt;
        for(const p of G.players){const v=ins[p.i];p.x=Math.max(24,Math.min(W-24,p.x+v.x*320*dt));p.y=Math.max(100,Math.min(H-24,p.y+v.y*320*dt));
          for(let c=G.coins.length-1;c>=0;c--){const o=G.coins[c];if(Math.hypot(o.x-p.x,o.y-p.y)<38){G.coins.splice(c,1);p.score++;spawn()}}}
        if(G.time<=0)finish();
      }else{
        for(const p of G.players)if(press[p.i])p.prog=Math.min(1,p.prog+.035);
        if(G.players.some(p=>p.prog>=1))finish();
      }
      drawGame();
    }else if(scene==="result"){if(sceneT>2&&press.some(Boolean)){G=null;setScene("lobby")}drawBg()}
    renderUI();
    requestAnimationFrame(frame);
  }
  function drawBg(){g.fillStyle="#14102b";g.fillRect(0,0,W,H)}
  function drawGame(){
    drawBg();g.textAlign="center";g.font="28px 'Lilita One',sans-serif";
    if(G.id==="coins"){
      g.strokeStyle="#ffffff0d";g.lineWidth=2;for(let x=0;x<=W;x+=80){g.beginPath();g.moveTo(x,90);g.lineTo(x,H);g.stroke()}for(let y=90;y<=H;y+=80){g.beginPath();g.moveTo(0,y);g.lineTo(W,y);g.stroke()}
      for(const o of G.coins){g.fillStyle="#ffd23f";g.beginPath();g.arc(o.x,o.y,15,0,7);g.fill();g.fillStyle="#c9a000";g.beginPath();g.arc(o.x,o.y,8,0,7);g.fill()}
      for(const p of G.players){g.fillStyle=COLS[p.i];g.beginPath();g.arc(p.x,p.y,24,0,7);g.fill();g.fillStyle="#14102b";g.font="22px 'Lilita One',sans-serif";g.fillText("J"+(p.i+1),p.x,p.y+8)}
      g.font="34px 'Lilita One',sans-serif";G.players.forEach((p,n)=>{g.fillStyle=COLS[p.i];g.fillText("J"+(p.i+1)+": "+p.score,110+n*190,50)});
      g.fillStyle="#f6f3ff";g.font="44px 'Lilita One',sans-serif";g.fillText(Math.ceil(Math.max(0,G.time))+"s",W/2,52+0);
    }else{
      const n=G.players.length,lh=Math.min(130,(H-120)/n);
      G.players.forEach((p,k)=>{const y=110+k*lh;g.fillStyle="#1f1a45";g.fillRect(60,y,W-120,lh-14);g.fillStyle="#ffffff22";g.fillRect(W-120,y,10,lh-14);
        const x=90+p.prog*(W-260);g.fillStyle=COLS[p.i];g.fillRect(60,y,x-60+24,lh-14);g.beginPath();g.arc(x+8,y+(lh-14)/2,(lh-14)/2-6,0,7);g.fillStyle="#fff";g.fill();g.fillStyle="#14102b";g.font="26px 'Lilita One',sans-serif";g.fillText("J"+(p.i+1),x+8,y+(lh-14)/2+9)});
      g.fillStyle="#f6f3ff";g.font="40px 'Lilita One',sans-serif";g.fillText(scene==="play"?"¡TOCÁ A!":"Preparate…",W/2,62);
    }
  }
  requestAnimationFrame(frame);
}
</script>
</body>
</html>
